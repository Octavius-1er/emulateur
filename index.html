<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Octavius</title>

  <style>
    :root {
      color-scheme: dark;

      --background: #0f172a;
      --toolbar: #172033;
      --toolbar-border: #2d3a52;
      --input: #0b1220;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --hover: #29364d;
      --error: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;

      overflow: hidden;

      background: var(--background);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* =========================
       BARRE DU NAVIGATEUR
       ========================= */

    .browser-bar {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 58px;

      padding: 8px 10px;

      background: var(--toolbar);
      border-bottom: 1px solid var(--toolbar-border);
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .browser-button {
      width: 38px;
      height: 38px;

      border: none;
      border-radius: 50%;

      background: transparent;
      color: var(--text);

      font-size: 20px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .browser-button:hover:not(:disabled) {
      background: var(--hover);
    }

    .browser-button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* =========================
       BARRE D'ADRESSE
       ========================= */

    .address-wrapper {
      flex: 1;

      display: flex;
      align-items: center;
    }

    #address {
      width: 100%;
      height: 40px;

      padding: 0 16px;

      border: 1px solid #344158;
      border-radius: 22px;

      outline: none;

      background: var(--input);
      color: var(--text);

      font-size: 14px;
    }

    #address:focus {
      border-color: var(--accent);
    }

    #address::placeholder {
      color: var(--muted);
    }

    /* =========================
       BARRE DE CHARGEMENT
       ========================= */

    #progress {
      width: 0;
      height: 3px;

      background: var(--accent);

      opacity: 0;

      transition:
        width 0.2s ease,
        opacity 0.2s ease;
    }

    /* =========================
       PAGE
       ========================= */

    #browser-frame {
      flex: 1;

      width: 100%;
      height: 100%;

      border: none;

      background: white;
    }

    /* =========================
       BARRE D'ÉTAT
       ========================= */

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      min-height: 30px;

      padding: 5px 10px;

      background: #141d2d;
      border-top: 1px solid var(--toolbar-border);

      color: var(--muted);

      font-size: 12px;
    }

    #status {
      flex: 1;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #status.error {
      color: var(--error);
    }

    .brand {
      flex-shrink: 0;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
      .browser-bar {
        min-height: 110px;

        flex-wrap: wrap;
      }

      .buttons {
        width: 100%;

        justify-content: center;
      }

      .address-wrapper {
        width: 100%;
      }
    }
  [hidden] { display: none !important; }

    #youtube-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    #login {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.97);
    }

    .login-box {
      width: min(340px, 90vw);
      padding: 24px;
      border: 1px solid var(--toolbar-border);
      border-radius: 12px;
      background: var(--toolbar);
    }

    .login-box h2 { margin: 0 0 8px; }
    .login-box p { margin: 0 0 12px; color: var(--muted); }

    .login-box input {
      width: 100%;
      height: 40px;
      margin-bottom: 10px;
      padding: 0 14px;
      border: 1px solid #344158;
      border-radius: 8px;
      background: var(--input);
      color: var(--text);
      font-size: 15px;
    }

    .login-box button {
      width: 100%;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #login-error { margin-top: 10px; color: var(--error); min-height: 1em; }
  </style>
</head>

<body>

  <!-- =========================
       BARRE DU NAVIGATEUR
       ========================= -->

  <form
    id="navigation-form"
    class="browser-bar"
    autocomplete="off"
  >

    <div class="buttons">

      <button
        id="back"
        class="browser-button"
        type="button"
        title="Précédent"
        disabled
      >
        ←
      </button>

      <button
        id="forward"
        class="browser-button"
        type="button"
        title="Suivant"
        disabled
      >
        →
      </button>

      <button
        id="reload"
        class="browser-button"
        type="button"
        title="Recharger"
      >
        ↻
      </button>

      <button
        id="home"
        class="browser-button"
        type="button"
        title="Accueil"
      >
        ⌂
      </button>

    </div>

    <div class="address-wrapper">

      <input
        id="address"
        type="text"
        placeholder="Entrez une adresse ou recherchez..."
        spellcheck="false"
        autocomplete="off"
      >

    </div>

  </form>

  <!-- =========================
       CHARGEMENT
       ========================= -->

  <div id="progress"></div>

  <!-- =========================
       PAGE WEB
       ========================= -->

  <iframe
    id="browser-frame"
    title="Octavius Browser"
    sandbox="allow-scripts allow-forms allow-presentation"
    allow="
      autoplay;
      fullscreen;
      picture-in-picture;
      encrypted-media;
      clipboard-read;
      clipboard-write
    "
  ></iframe>

  <iframe
    id="youtube-frame"
    hidden
    title="Lecteur YouTube"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
    allowfullscreen
  ></iframe>

  <!-- =========================
       BARRE D'ÉTAT
       ========================= -->

  <div class="status-bar">

    <span id="status">
      Prêt.
    </span>

    <span class="brand">
      Octavius
    </span>

  </div>

  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <form id="login" hidden>
    <div class="login-box">
      <h2>Accès protégé</h2>
      <p>Entre le code d'accès.</p>
      <input id="login-code" type="password" autocomplete="off" aria-label="Code d'accès">
      <button type="submit">Entrer</button>
      <p id="login-error" role="alert"></p>
    </div>
  </form>

  <script src="/script.js" defer></script>

</body>
</html>
