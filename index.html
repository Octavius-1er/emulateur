<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octavius</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0f172a;
      --toolbar: #172033;
      --toolbar-border: #2d3a52;
      --input: #0b1220;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #8b5cf6;
      --hover: #29364d;
      --error: #fb7185;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;

      background: var(--bg);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /* =========================
       BARRE DE NAVIGATION
       ========================= */

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 58px;
      padding: 8px 10px;

      background: var(--toolbar);
      border-bottom: 1px solid var(--toolbar-border);
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    button {
      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: transparent;
      color: var(--text);

      font-size: 20px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--hover);
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* =========================
       BARRE D'ADRESSE
       ========================= */

    .address-wrapper {
      flex: 1;
      min-width: 0;
    }

    #address {
      width: 100%;
      height: 40px;

      padding: 0 16px;

      border: 1px solid #344158;
      border-radius: 22px;

      outline: none;

      background: var(--input);
      color: var(--text);

      font-size: 14px;
    }

    #address:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.12);
    }

    #address::placeholder {
      color: var(--muted);
    }

    /* =========================
       PROGRESSION
       ========================= */

    #progress {
      width: 0;
      height: 3px;

      background: var(--accent);

      opacity: 0;

      transition:
        width 0.2s ease,
        opacity 0.2s ease;
    }

    /* =========================
       PAGE
       ========================= */

    #browser-frame {
      flex: 1;

      width: 100%;
      height: 100%;

      border: 0;

      background: #fff;
    }

    /* =========================
       BARRE D'ÉTAT
       ========================= */

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 10px;

      min-height: 30px;
      padding: 5px 10px;

      background: #141d2d;
      border-top: 1px solid var(--toolbar-border);

      color: var(--muted);

      font-size: 12px;
    }

    #status {
      flex: 1;

      min-width: 0;

      overflow: hidden;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #status.error {
      color: var(--error);
    }

    .brand {
      flex-shrink: 0;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {
      .toolbar {
        flex-wrap: wrap;
        min-height: 108px;
      }

      .buttons {
        width: 100%;
        justify-content: center;
      }

      .address-wrapper {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       BARRE DE NAVIGATION
       ========================= -->

  <form
    id="navigation-form"
    class="toolbar"
    autocomplete="off"
  >

    <div class="buttons">

      <button
        id="back"
        type="button"
        title="Précédent"
        disabled
      >
        ←
      </button>

      <button
        id="forward"
        type="button"
        title="Suivant"
        disabled
      >
        →
      </button>

      <button
        id="reload"
        type="button"
        title="Recharger"
      >
        ↻
      </button>

      <button
        id="home"
        type="button"
        title="Accueil"
      >
        ⌂
      </button>

    </div>

    <div class="address-wrapper">

      <input
        id="address"
        type="text"
        placeholder="Adresse ou recherche..."
        spellcheck="false"
        autocomplete="off"
        autofocus
      >

    </div>

  </form>

  <!-- =========================
       BARRE DE CHARGEMENT
       ========================= -->

  <div id="progress"></div>

  <!-- =========================
       PAGE WEB
       ========================= -->

  <iframe
    id="browser-frame"
    title="Octavius Browser"

    sandbox="
      allow-scripts
      allow-forms
      allow-popups
      allow-modals
      allow-presentation
      allow-downloads
    "

    allow="
      autoplay;
      fullscreen;
      picture-in-picture;
      encrypted-media;
      clipboard-read;
      clipboard-write
    "
  ></iframe>

  <!-- =========================
       BARRE D'ÉTAT
       ========================= -->

  <div class="status-bar">

    <span id="status">
      Prêt.
    </span>

    <span class="brand">
      Octavius
    </span>

  </div>

  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script src="/script.js" defer></script>

</body>
</html>
